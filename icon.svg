<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF50"/>
      <stop offset="100%" stop-color="#8B6B2E"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Subtle shine overlay -->
  <rect width="512" height="256" rx="100" fill="url(#shine)"/>

  <!-- ══ Menorah (7 branches) ══ -->
  <!-- Base -->
  <rect x="172" y="394" width="168" height="20" rx="10" fill="white"/>
  <!-- Foot legs -->
  <rect x="172" y="386" width="20" height="30" rx="6" fill="white"/>
  <rect x="320" y="386" width="20" height="30" rx="6" fill="white"/>
  <!-- Center stem -->
  <rect x="248" y="190" width="16" height="210" rx="8" fill="white"/>

  <!-- Left far arm -->
  <path d="M256 290 Q230 290 208 260 Q196 243 192 228" stroke="white" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left near arm -->
  <path d="M256 300 Q238 300 226 278 Q218 264 216 252" stroke="white" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right near arm -->
  <path d="M256 300 Q274 300 286 278 Q294 264 296 252" stroke="white" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right far arm -->
  <path d="M256 290 Q282 290 304 260 Q316 243 320 228" stroke="white" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Candle flames — oval shapes at tips -->
  <!-- Center -->
  <ellipse cx="256" cy="178" rx="11" ry="15" fill="white"/>
  <!-- Left near -->
  <ellipse cx="216" cy="239" rx="10" ry="14" fill="white"/>
  <!-- Left far -->
  <ellipse cx="192" cy="215" rx="10" ry="14" fill="white"/>
  <!-- Right near -->
  <ellipse cx="296" cy="239" rx="10" ry="14" fill="white"/>
  <!-- Right far -->
  <ellipse cx="320" cy="215" rx="10" ry="14" fill="white"/>

  <!-- Text label -->
  <text x="256" y="468" text-anchor="middle"
        font-family="'Frank Ruhl Libre', 'David', serif"
        font-size="42" font-weight="700"
        fill="white" opacity="0.92"
        letter-spacing="1">חב״ד עפולה</text>
</svg>
