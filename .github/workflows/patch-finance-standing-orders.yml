name: Patch finance standing-order breakdown

on:
  push:
    paths:
      - '.github/workflows/patch-finance-standing-orders.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add explicit standing-order line to safe-cashflow detail
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/components/FinanceTab.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''        <DetailLine label="השפעת כל ההתחייבויות וההכנסות המובטחות" value={summary.guaranteedBalance - summary.currentBalance} />'''
          new = '''        <DetailLine label="התחייבויות עתידיות" value={-summary.committedExpense} />
        <DetailLine label="הכנסות עתידיות שהוגדרו כמובטחות" value={summary.committedIncome} />
        <DetailLine label="הוראות קבע צפויות" value={summary.standingOrderIncome} />'''
          if old not in text:
              raise SystemExit('Target line not found; refusing to make an unsafe patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FinanceTab.tsx
          git commit -m "Show standing orders in safe cashflow breakdown"
          git push
