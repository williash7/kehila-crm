name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply standing-order breakdown patch once
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/FinanceTab.tsx')
          text = path.read_text(encoding='utf-8')
          old = '        <DetailLine label="השפעת כל ההתחייבויות וההכנסות המובטחות" value={summary.guaranteedBalance - summary.currentBalance} />'
          new = '''        <DetailLine label="התחייבויות עתידיות" value={-summary.committedExpense} />
        <DetailLine label="הכנסות עתידיות שהוגדרו כמובטחות" value={summary.committedIncome} />
        <DetailLine label="הוראות קבע צפויות" value={summary.standingOrderIncome} />'''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          if ! git diff --quiet -- src/components/FinanceTab.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/FinanceTab.tsx
            git commit -m "Show standing orders in safe cashflow breakdown"
            git push origin main
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          GITHUB_SHA: ${{ github.sha }}
          # מזהה OAuth לכניסה עם גוגל. אינו סוד — מזהה כזה נועד להיות גלוי
          # בקוד צד-לקוח. מוגדר ב-Settings ← Secrets and variables ← Actions
          # ← Variables בשם GOOGLE_CLIENT_ID. אם לא הוגדר, כפתור הכניסה
          # פשוט לא מוצג והאפליקציה עובדת בהגדרה ידנית.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

      # GitHub Pages עשוי להגיש index.html ישן מהמטמון במשך כמה דקות אחרי
      # פריסה. שומרים רק את קובצי הכניסה שאליהם הפנו שמונה הפריסות האחרונות,
      # כדי שהמטמון הישן לא יקבל 404 — בלי לצבור את כל ההיסטוריה לנצח.
      - name: Preserve recent entry assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=8 origin gh-pages:refs/remotes/origin/gh-pages
          while IFS= read -r rev; do
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              if git cat-file -e "${rev}:${asset}"; then
                mkdir -p "dist/$(dirname "$asset")"
                git show "${rev}:${asset}" > "dist/${asset}"
              fi
            done < <(git show "${rev}:index.html" | grep -oE 'assets/index-[^" ]+\.(js|css)' | sort -u || true)
          done < <(git rev-list --max-count=8 origin/gh-pages)

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
