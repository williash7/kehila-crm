name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          GITHUB_SHA: ${{ github.sha }}
          # מזהה OAuth לכניסה עם גוגל. אינו סוד — מזהה כזה נועד להיות גלוי
          # בקוד צד-לקוח. מוגדר ב-Settings ← Secrets and variables ← Actions
          # ← Variables בשם GOOGLE_CLIENT_ID. אם לא הוגדר, כפתור הכניסה
          # פשוט לא מוצג והאפליקציה עובדת בהגדרה ידנית.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

      # GitHub Pages עשוי להגיש index.html ישן מהמטמון במשך כמה דקות אחרי
      # פריסה. שומרים רק את קובצי הכניסה שאליהם הפנו שמונה הפריסות האחרונות,
      # כדי שהמטמון הישן לא יקבל 404 — בלי לצבור את כל ההיסטוריה לנצח.
      - name: Preserve recent entry assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=8 origin gh-pages:refs/remotes/origin/gh-pages
          while IFS= read -r rev; do
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              if git cat-file -e "${rev}:${asset}"; then
                mkdir -p "dist/$(dirname "$asset")"
                git show "${rev}:${asset}" > "dist/${asset}"
              fi
            done < <(git show "${rev}:index.html" | grep -oE 'assets/index-[^" ]+\.(js|css)' | sort -u || true)
          done < <(git rev-list --max-count=8 origin/gh-pages)

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
