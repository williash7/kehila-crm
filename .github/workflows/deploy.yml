name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # מזהה OAuth לכניסה עם גוגל. אינו סוד — מזהה כזה נועד להיות גלוי
          # בקוד צד-לקוח. מוגדר ב-Settings ← Secrets and variables ← Actions
          # ← Variables בשם GOOGLE_CLIENT_ID. אם לא הוגדר, כפתור הכניסה
          # פשוט לא מוצג והאפליקציה עובדת בהגדרה ידנית.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
